name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MagdyPOS.csproj
      - run: dotnet build MagdyPOS.csproj -c Release --no-restore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t magdypos .
      - name: Smoke test
        run: |
          docker run -d -p 8080:8080 --name magdypos magdypos
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && exit 0; sleep 2; done
          docker logs magdypos; exit 1
